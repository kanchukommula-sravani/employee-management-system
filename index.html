<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <fieldset>
        <legend align="center">form</legend>
        <form action="" align="center">
            <label for="">id :</label>
            <input type="text" name="" id="inp1" placeholder="enter id"><br><br>
            <label for="">Name :</label>
            <input type="text" name="" id="inp2" placeholder="enter name"><br><br>
            <label for="">Role :</label>
            <input type="text" name="" id="inp3" placeholder="enter role"><br><br>
            <label for="">Salary</label>
            <input type="text" name="" id="inp4" placeholder="salary" ><br><br>
            <button type="submit" id="btn">ADD</button><br><br>
            <table cellspacing="0" align="center">
                <tr>
                    <th>id</th>
                    <th>Name</th>
                    <th>Role</th>
                    <th>Salary</th>
                    <th>Modify</th>
                    <th>Trash</th>
                </tr>
            </table>
        </form>
    </fieldset>

    <script src="./script.js"></script>
</body>
</html>
